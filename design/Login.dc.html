<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
  <style>
    body { margin: 0; background: #fdfdfc; color: #2b2b28;
           font-family: ui-sans-serif, system-ui, 'Segoe UI', Helvetica, sans-serif; }
    a { color: #9c5f4a; } a:hover { color: #7a4636; }
    .hand { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; }
    .box { border: 1.5px solid #c9c9c2; border-radius: 3px; background: #fff; }
    .btn { border: 1.5px solid #2b2b28; border-radius: 3px; background: #fff; color: #2b2b28;
           padding: 11px 18px; font-size: 14px; min-height: 44px; box-sizing: border-box;
           display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: #9c5f4a; border-color: #9c5f4a; color: #fff; }
    .field { border: 1.5px solid #c9c9c2; border-radius: 3px; background: #fff;
             padding: 12px 13px; min-height: 44px; box-sizing: border-box;
             color: #8a8a83; font-size: 14px; display: flex; align-items: center; }
    .muted { color: #8a8a83; }
    .label { font-size: 13px; margin-bottom: 6px; display: block; }
  </style>
</helmet>

<div style="width: 1200px; min-height: 720px; background: #fdfdfc; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1.5px solid #c9c9c2; background: #fff;">
    <span class="hand" style="font-size: 23px; letter-spacing: 0.5px;">unlockt</span>
    <span class="muted" style="font-size: 14px;">No account? <a href="#">Register</a></span>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 48px 32px;">
    <div class="box" style="width: 420px; padding: 34px 34px 30px 34px; display: flex; flex-direction: column; gap: 20px;">

      <div>
        <h1 class="hand" style="margin: 0 0 6px 0; font-size: 27px; font-weight: 400;">Log in</h1>
        <span class="muted" style="font-size: 14px;">Pick up where you left off.</span>
      </div>

      <div style="border: 1.5px solid #9c5f4a; background: #f6ece8; border-radius: 3px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9c5f4a" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.2"/></svg>
        <span style="font-size: 13px; color: #7a4636; line-height: 1.45;">Email or password didn't match. Try again.</span>
      </div>

      <div>
        <span class="label">Email</span>
        <div class="field">you@example.com</div>
      </div>

      <div>
        <span class="label">Password</span>
        <div class="field">••••••••</div>
      </div>

      <div class="btn btn-primary" style="width: 100%;">Log in</div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
