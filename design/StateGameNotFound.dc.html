<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
  <style>
    body { margin: 0; background: #fdfdfc; color: #2b2b28;
           font-family: ui-sans-serif, system-ui, 'Segoe UI', Helvetica, sans-serif; }
    a { color: #9c5f4a; } a:hover { color: #7a4636; }
    .hand { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; }
    .box { border: 1.5px solid #c9c9c2; border-radius: 3px; background: #fff; }
    .btn { border: 1.5px solid #2b2b28; border-radius: 3px; background: #fff; color: #2b2b28;
           padding: 11px 18px; font-size: 14px; min-height: 44px; box-sizing: border-box;
           display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .field { border: 1.5px solid #c9c9c2; border-radius: 3px; background: #fff;
             padding: 12px 13px; min-height: 44px; box-sizing: border-box;
             color: #8a8a83; font-size: 14px; display: flex; align-items: center; gap: 9px; }
    .muted { color: #8a8a83; }
    .tag { font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: #8a8a83; }
  </style>
</helmet>

<div style="width: 620px; min-height: 380px; background: #fdfdfc; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 12px;">

  <span class="tag">Add game &mdash; no results</span>

  <div class="box" style="padding: 22px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">

    <div class="field">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a8a83" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span style="color: #2b2b28;">qwrtyx adventure</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 12px 24px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c2c2ba" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M8.8 8.8l4.4 4.4"/><path d="M13.2 8.8l-4.4 4.4"/></svg>
      <h2 class="hand" style="margin: 0; font-size: 20px; font-weight: 400;">No games matched that title</h2>
      <p class="muted" style="margin: 0; font-size: 13.5px; line-height: 1.55; max-width: 400px;">
        Check the spelling, or try a shorter search &mdash; just one or two words from the title usually works better.
      </p>
    </div>

    <div style="display: flex; justify-content: center;">
      <div class="btn">Clear search</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
